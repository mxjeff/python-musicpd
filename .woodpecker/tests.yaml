matrix:
  PYTHON_VERSION:
    - 3.11
    - 3.12
    - 3.13
    - 3.14
    - 3.15

steps:
  - name: test
    image: python:${PYTHON_VERSION}
    commands:
      - python -m venv venv
      - . venv/bin/activate
      - pip install pytest-cov build
      - py.test -q --cov=musicpd test.py
    when:
      - path:
          include: ['musicpd.py', 'test.py', '.woodpecker/*']
        event: [ push, manual, cron ]

  - name: build
    image: python:${PYTHON_VERSION}
    commands:
      - . venv/bin/activate
      # packaging test
      - python3 -m build -s -w
      - pip install dist/*.whl
    when:
      - path:
          include: ['pyproject.toml', '.woodpecker/*']
        event: [ push, manual, cron ]

  - name: sphinx
    image: python:${PYTHON_VERSION}
    commands:
      - . venv/bin/activate
      - pip install sphinx sphinx_rtd_theme
      - sphinx-build doc/source -b html ./html -D html_theme=sphinx_rtd_theme
    when:
      - evaluate: 'PYTHON_VERSION == "3.13"'
        path:
          include: ['doc/**', '.woodpecker/*', 'README.rst']
        event: [ push, manual, cron ]
